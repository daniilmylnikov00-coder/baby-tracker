<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Мыльниковы Family</title>

<!-- ПОДКЛЮЧАЕМ ИКОНКУ И МАНИФЕСТ -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Great+Vibes&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="lock">
  <div class="logo-text">
    <span class="logo-cursive">Мыльниковы</span><br>
    <span class="logo-family">Family</span>
  </div>
  <div class="logo-sub">Введите семейный код</div>
  <input id="code" type="password" inputmode="numeric" placeholder="····" autofocus>
  <button onclick="unlock()">Войти</button>
  <div id="err"></div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app">
  <header>
    <h1>Мыльниковы Family</h1>
  </header>

  <div class="scrollable-content">
    <!-- 1. БЫТОВУХА -->
    <div id="tab-byt" class="tab-content active">
      <div class="glass-card" style="background: rgba(254, 243, 242, 0.6); color: #7a4f4c; border: 1px solid rgba(255,255,255,0.5);" id="lastFeedBox">
        Загрузка...
      </div>
      <button class="btn feed" onclick="addEvent('feed')">🍼 Кормление</button>
      <button class="btn sleep" onclick="addEvent('sleep')">😴 Сон</button>
      <button class="btn diaper" onclick="addEvent('diaper')">💩 Подгузник</button>
      
      <h3 style="color: var(--text-light); font-size: 16px; margin: 24px 0 12px; padding-left: 8px;">Последние события</h3>
      <div class="glass-card" style="padding: 0 16px;">
        <ul class="list" id="eventsList"></ul>
      </div>
    </div>

    <!-- 2. АЛЬБОМ ВАРЕЧКИ -->
    <div id="tab-varya" class="tab-content">
      <div class="upload-area glass-card">
        <input type="file" id="varyaPhotoInput" accept="image/*" style="display: none;" onchange="uploadPhoto(this, 'varya')">
        <button id="varyaUploadBtn" class="btn upload-btn" onclick="document.getElementById('varyaPhotoInput').click()">📸 Добавить фото</button>
        <input type="text" id="varyaPhotoCaption" placeholder="Подпись (например: Тест о беременности)" style="width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.6); font-family: inherit;">
      </div>
      <div id="varyaGallery" class="photo-album"></div>
    </div>

    <!-- 3. СЕМЕЙНЫЙ АЛЬБОМ -->
    <div id="tab-family" class="tab-content">
      <div class="upload-area glass-card">
        <input type="file" id="familyPhotoInput" accept="image/*" style="display: none;" onchange="uploadPhoto(this, 'family')">
        <button id="familyUploadBtn" class="btn upload-btn" onclick="document.getElementById('familyPhotoInput').click()">📸 Добавить фото</button>
        <input type="text" id="familyPhotoCaption" placeholder="Подпись..." style="width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.6); font-family: inherit;">
      </div>
      <div id="familyGallery" class="photo-album"></div>
    </div>

       <!-- 4. ЗАДАЧИ -->
    <div id="tab-tasks" class="tab-content">
      <div class="glass-card" style="padding: 16px; margin-bottom: 16px;">
        <input type="text" id="taskInput" placeholder="Новая задача..." style="width: 100%; padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.6); font-family: inherit; margin-bottom: 10px;">
        
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="datetime-local" id="taskTime" style="flex: 1; padding: 10px; border-radius: 12px; border: none; background: rgba(255,255,255,0.6); font-family: inherit; color: var(--text);">
          <button onclick="addTask()" style="background: linear-gradient(135deg, #f6d3d0, #e6a9a4); color: white; border: none; border-radius: 12px; width: 48px; height: 48px; font-size: 24px; cursor: pointer; flex-shrink: 0;">+</button>
        </div>
      </div>
      
      <!-- КНОПКА УВЕДОМЛЕНИЙ -->
      <button id="pushBtn" onclick="enablePush()" class="btn" style="background: linear-gradient(135deg, #f6d3d0, #e6a9a4); color: white; font-size: 14px; padding: 12px; margin-bottom: 16px; border-radius: 12px; box-shadow: 0 4px 12px rgba(217, 154, 150, 0.3); border: none; width: 100%; cursor: pointer;">
        🔔 Включить уведомления
      </button>

      <div class="glass-card" style="padding: 0 16px;">
        <ul class="list" id="tasksList"></ul>
      </div>
    </div>

    <!-- 5. ПОКУПКИ -->
    <div id="tab-shop" class="tab-content">
      <div class="input-row glass-card" style="padding: 8px;">
        <input type="text" id="shopInput" placeholder="Что купить или ссылка..." onkeypress="if(event.key==='Enter') addShop()">
        <button onclick="addShop()">+</button>
      </div>
      <div class="glass-card" style="padding: 0 16px;">
        <ul class="list" id="shopList"></ul>
      </div>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <nav class="bottom-nav">
    <button class="active" onclick="switchTab('byt', this)">
      <span class="icon">🏠</span> Быт
    </button>
    <button onclick="switchTab('varya', this)">
      <span class="icon">👶</span> Варя
    </button>
    <button onclick="switchTab('family', this)">
      <span class="icon">📸</span> Семья
    </button>
    <button onclick="switchTab('tasks', this)">
      <span class="icon">📝</span> Задачи
    </button>
    <button onclick="switchTab('shop', this)">
      <span class="icon">🛒</span> Покупки
    </button>
  </nav>
</div>

<!-- ПОДКЛЮЧАЕМ SUPABASE (БИБЛИОТЕКА) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- НАШИ СКРИПТЫ С НОВЫМИ ВЕРСИЯМИ (v=10) -->
<script src="js/supabase.js?v=10"></script>
<script src="js/byt.js?v=10"></script>
<script src="js/tasks.js?v=10"></script>
<script src="js/shop.js?v=10"></script>
<script src="js/album-varya.js?v=10"></script>
<script src="js/app.js?v=10"></script>
<script src="js/push.js?v=55"></script>
</body>
</html>
