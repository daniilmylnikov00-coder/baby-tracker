<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Мыльниковы Family</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="lock">
  <div class="logo-text">Мыльниковы Family</div>
  <div class="logo-sub">Введите семейный код</div>
  <input id="code" type="password" inputmode="numeric" placeholder="····" autofocus>
  <button onclick="unlock()">Войти</button>
  <div id="err"></div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app">
  <header>
    <h1>Мыльниковы Family</h1>
  </header>

  <!-- 1. БЫТОВУХА -->
  <div id="tab-byt" class="tab-content active">
    <div class="card" style="background: #fef3f2; color: #7a4f4c; border: none;" id="lastFeedBox">
      Кормлений пока не было
    </div>
    <button class="btn feed" onclick="addEvent('feed')">🍼 Кормление</button>
    <button class="btn sleep" onclick="addEvent('sleep')">😴 Сон</button>
    <button class="btn diaper" onclick="addEvent('diaper')">💩 Подгузник</button>
    
    <h3 style="color: var(--text-light); font-size: 16px; margin: 24px 0 12px;">Последние события</h3>
    <div class="card" style="padding: 0 16px;">
      <ul class="list" id="eventsList"></ul>
    </div>
  </div>

  <!-- 2. АЛЬБОМ ВАРЕЧКИ -->
  <div id="tab-varya" class="tab-content">
    <div class="placeholder">
      <div style="font-size: 40px; margin-bottom: 12px;">👶</div>
      <h3>Альбом Варечки</h3>
      <p>Здесь скоро появятся первые фото.</p>
    </div>
  </div>

  <!-- 3. СЕМЕЙНЫЙ АЛЬБОМ -->
  <div id="tab-family" class="tab-content">
    <div class="placeholder">
      <div style="font-size: 40px; margin-bottom: 12px;">📸</div>
      <h3>Семейный альбом</h3>
      <p>Здесь будут ваши общие фотографии.</p>
    </div>
  </div>

  <!-- 4. ЗАДАЧИ -->
  <div id="tab-tasks" class="tab-content">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Новая задача..." onkeypress="if(event.key==='Enter') addTask()">
      <button onclick="addTask()">+</button>
    </div>
    <div class="card" style="padding: 0 16px;">
      <ul class="list" id="tasksList"></ul>
    </div>
  </div>

  <!-- 5. ПОКУПКИ -->
  <div id="tab-shop" class="tab-content">
    <div class="input-row">
      <input type="text" id="shopInput" placeholder="Что купить или ссылка..." onkeypress="if(event.key==='Enter') addShop()">
      <button onclick="addShop()">+</button>
    </div>
    <div class="card" style="padding: 0 16px;">
      <ul class="list" id="shopList"></ul>
    </div>
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <nav class="bottom-nav">
    <button class="active" onclick="switchTab('byt', this)">
      <span class="icon">🏠</span> Быт
    </button>
    <button onclick="switchTab('varya', this)">
      <span class="icon">👶</span> Варя
    </button>
    <button onclick="switchTab('family', this)">
      <span class="icon">📸</span> Семья
    </button>
    <button onclick="switchTab('tasks', this)">
      <span class="icon">📝</span> Задачи
    </button>
    <button onclick="switchTab('shop', this)">
      <span class="icon">🛒</span> Покупки
    </button>
  </nav>
</div>

<!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
<script src="js/byt.js"></script>
<script src="js/tasks.js"></script>
<script src="js/shop.js"></script>
<script src="js/app.js"></script>
</body>
</html>
